name: EventFlow CI / Quality & Security Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-test-quality:
    name: Build, Lint & Test (.NET 9)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Cache NuGet Packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore Dependencies
        run: dotnet restore EventFlow.sln

      - name: Verify Code Formatting (.editorconfig)
        run: dotnet format --verify-no-changes --verbosity diagnostic

      - name: Build Solution (TreatWarningsAsErrors)
        run: dotnet build EventFlow.sln --no-restore -c Release

      - name: Run Unit Tests with Coverage
        run: >
          dotnet test tests/EventFlow.UnitTests/EventFlow.UnitTests.csproj
          --no-build
          -c Release
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults/UnitTests
          --logger "trx;LogFileName=unit_tests.trx"

      - name: Run Integration Tests (Testcontainers)
        run: >
          dotnet test tests/EventFlow.IntegrationTests/EventFlow.IntegrationTests.csproj
          --no-build
          -c Release
          --results-directory ./TestResults/IntegrationTests
          --logger "trx;LogFileName=integration_tests.trx"

      - name: Security Audit (Vulnerable Package Scan)
        run: dotnet list package --vulnerable --include-transitive

  docker-build-validation:
    name: Validate Multi-Stage Docker Builds
    runs-on: ubuntu-latest
    needs: build-test-quality
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build EventFlow API Container Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: false
          tags: eventflow-api:ci-test

      - name: Build EventFlow Worker Container Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.worker
          push: false
          tags: eventflow-worker:ci-test
